services:
  undiscord-cleanup:
    build: .
    container_name: undiscord-auto-cleanup
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    volumes:
      - ./logs:/app/logs
    command: npm start
    # Pour debug X11 (optionnel)
